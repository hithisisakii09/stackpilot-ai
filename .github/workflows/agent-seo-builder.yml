name: Agent 2 — SEO Content & Page Builder
on:
  schedule:
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-seo-builder
  cancel-in-progress: false

jobs:
  build-seo-guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run Agent 2 SEO buyer guide builder
        env:
          STACKPILOT_ALLOW_LIVE_SEO: 'true'
          STACKPILOT_ALLOW_LIVE_AI: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/agent-seo-builder.mjs --live --write --report-out /tmp/seo-builder-report.md

      - name: Append report to GitHub Step Summary
        if: always()
        run: |
          if [ -f /tmp/seo-builder-report.md ]; then
            cat /tmp/seo-builder-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for generated guide changes
        id: diff
        run: |
          if git diff --quiet src/data/agent-buyer-guides.json src/data/seo-topic-backlog.json public/sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new SEO guide changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate repository before opening PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          node --test tests/*.test.mjs
          npm run build
          node scripts/check-build.mjs
          node scripts/release-preflight.mjs --json

      - name: Create or update Pull Request with new SEO guide
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="agent/seo-builder-${DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/agent-buyer-guides.json src/data/seo-topic-backlog.json public/sitemap.xml
          git commit -m "feat(agent-2): publish grounded buyer guide (${DATE})"
          git push -u origin "${BRANCH}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body-file /tmp/seo-builder-report.md
          else
            gh pr create --base main --head "$BRANCH" --title "feat(agent-2): autonomous grounded SEO buyer guide (${DATE})" --body-file /tmp/seo-builder-report.md
          fi
