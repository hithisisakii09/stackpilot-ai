name: Validate and build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - name: Capture reproducible npm resolution for lockfile creation
        run: |
          echo STACKPILOT_LOCK_BASE64_START
          base64 -w0 package-lock.json
          echo
          echo STACKPILOT_LOCK_BASE64_END
