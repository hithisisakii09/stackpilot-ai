name: Agent 4 — Vendor Partnerships & Outreach
on:
  schedule:
    - cron: '30 4 * * 2'
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Optional vendor slug (hubspot, pipedrive, semrush, ahrefs, kinsta, cloudways)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-vendor-outreach
  cancel-in-progress: false

jobs:
  draft-vendor-outreach:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run Agent 4 vendor outreach drafter
        env:
          STACKPILOT_ALLOW_LIVE_OUTREACH: 'true'
          STACKPILOT_ALLOW_LIVE_AI: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUTREACH_VENDOR: ${{ github.event.inputs.vendor }}
        run: node scripts/agent-vendor-outreach.mjs --live --write --report-out /tmp/vendor-outreach-report.md

      - name: Append report to GitHub Step Summary
        if: always()
        run: |
          if [ -f /tmp/vendor-outreach-report.md ]; then
            cat /tmp/vendor-outreach-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for generated outreach draft changes
        id: diff
        run: |
          if git diff --quiet src/data/agent-vendor-outreach-drafts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new outreach draft changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate repository before opening PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          node --test tests/*.test.mjs
          npm run build
          node scripts/check-build.mjs
          node scripts/release-preflight.mjs --json

      - name: Create or update Pull Request with new outreach draft
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="agent/vendor-outreach-${DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/agent-vendor-outreach-drafts.json
          git commit -m "feat(agent-4): draft vendor partnership outreach (${DATE})"
          git push -u origin "${BRANCH}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body-file /tmp/vendor-outreach-report.md
          else
            gh pr create --base main --head "$BRANCH" --title "feat(agent-4): vendor partnership outreach draft (${DATE})" --body-file /tmp/vendor-outreach-report.md
          fi
