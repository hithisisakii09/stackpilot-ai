name: Agent 3 — Traffic Distribution & GSC Feedback

on:
  schedule:
    - cron: '0 5 * * 1,4'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional: target slug to draft (guide or comparison slug)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-traffic-distribution
  cancel-in-progress: false

jobs:
  run-agent:
    name: Draft Distribution Pack
    runs-on: ubuntu-latest
    env:
      STACKPILOT_ALLOW_LIVE_DISTRIBUTION: ${{ secrets.STACKPILOT_ALLOW_LIVE_DISTRIBUTION }}
      STACKPILOT_ALLOW_LIVE_AI: ${{ secrets.STACKPILOT_ALLOW_LIVE_AI }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run traffic distribution agent
        id: agent
        run: |
          SLUG_ARG=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            SLUG_ARG="--slug ${{ github.event.inputs.slug }}"
          fi
          node scripts/agent-traffic-distribution.mjs --live --write $SLUG_ARG >> "$GITHUB_STEP_SUMMARY" 2>&1

      - name: Check for changes to agent-distribution-drafts.json
        id: diff
        run: |
          if git diff --quiet src/data/agent-distribution-drafts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate distribution drafts
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/validate.mjs

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="agent/traffic-distribution-${DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/agent-distribution-drafts.json
          git commit -m "feat(agent-15): draft distribution pack [${DATE}] [skip ci]"
          git push -u origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Agent 3: Distribution pack draft [${DATE}]" \
            --body "Automated distribution pack draft from Agent 3. Status: pending_owner_review. ownerApprovalRequired: true. Requires owner review before any content is posted." \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
