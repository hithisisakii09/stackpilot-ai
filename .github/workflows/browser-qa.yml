name: Browser acceptance (Chromium)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackpilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install locked application dependencies
        run: npm ci
      - name: Build and validate application
        run: npm test
      - name: Install isolated, pinned browser QA tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser acceptance
        run: node scripts/browser-acceptance.mjs
      - name: Store non-sensitive local screenshot evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: stackpilot-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: ignore
          retention-days: 7
